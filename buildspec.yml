version: 0.2

env:
  variables:
    ECR_REPO_NAME: "2048-game"
    AWS_ACCOUNT_ID: "969084114620"
    AWS_REGION: "ap-south-1"

phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      # Write build-time metadata - this IS Option A, baked in as the fallback for Option B
      - >
        echo "{
          \"commitSha\": \"$CODEBUILD_RESOLVED_SOURCE_VERSION\",
          \"buildId\": \"$CODEBUILD_BUILD_ID\",
          \"buildTime\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
        }" > build-metadata.json
      - cat build-metadata.json

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      # --platform required: building on Apple Silicon-equivalent build env, target is x86 EC2
      - docker build --platform linux/amd64 -t $ECR_REPO_NAME:$IMAGE_TAG .
      - docker tag $ECR_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME:$IMAGE_TAG
      - docker tag $ECR_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME:latest

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME:$IMAGE_TAG
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME:latest
      - printf '[{"name":"2048-container","imageUri":"%s"}]' $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
