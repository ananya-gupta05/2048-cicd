<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deploy Status</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 2rem; }
  h1 { font-size: 1.4rem; color: #58a6ff; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; }
  .label { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .value { font-size: 1rem; margin-bottom: 0.6rem; }
  .status-ok { color: #3fb950; }
  .status-bad { color: #f85149; }
  .status-warn { color: #d29922; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  td, th { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #21262d; }
  #source-badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; }
  .badge-live { background: #133929; color: #3fb950; }
  .badge-fallback { background: #3b2410; color: #d29922; }
</style>
</head>
<body>
  <h1>2048 CI/CD Deploy Status <span id="source-badge"></span></h1>

  <div class="grid">
    <div class="card">
      <div class="label">Latest Commit / Build</div>
      <div class="value" id="commit">-</div>
      <div class="label">Build Time</div>
      <div class="value" id="build-time">-</div>
      <div class="label">Build ID</div>
      <div class="value" id="build-id">-</div>
    </div>

    <div class="card">
      <div class="label">ECS Service</div>
      <div class="value" id="ecs-summary">-</div>
      <div class="label">Deployment Status</div>
      <div class="value" id="ecs-deployment">-</div>
    </div>
  </div>

  <div class="card">
    <div class="label">Pipeline Stages</div>
    <table id="stages-table"><tbody></tbody></table>
  </div>

  <div class="card">
    <div class="label">Recent Deployments</div>
    <table id="history-table">
      <thead><tr><th>Execution</th><th>Status</th><th>Started</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function statusClass(s) {
      if (['SUCCEEDED', 'RUNNING', 'HEALTHY'].includes(s)) return 'status-ok';
      if (['FAILED', 'STOPPED', 'UNHEALTHY'].includes(s)) return 'status-bad';
      return 'status-warn';
    }

    async function refresh() {
      const res = await fetch('/api/status');
      const data = await res.json();

      const badge = document.getElementById('source-badge');
      badge.textContent = data.source === 'live' ? 'LIVE' : 'FALLBACK (build-time snapshot)';
      badge.className = data.source === 'live' ? 'badge-live' : 'badge-fallback';

      const meta = data.buildMeta || {};
      document.getElementById('commit').textContent = meta.commitSha || '-';
      document.getElementById('build-time').textContent = meta.buildTime || '-';
      document.getElementById('build-id').textContent = meta.buildId || '-';

      const ecs = data.ecs;
      if (ecs && !ecs.error) {
        document.getElementById('ecs-summary').innerHTML =
          `Running: ${ecs.runningCount} / Desired: ${ecs.desiredCount} / Pending: ${ecs.pendingCount}`;
        const dep = (ecs.deploymentStatus || [])[0];
        document.getElementById('ecs-deployment').innerHTML = dep
          ? `<span class="${statusClass(dep.status)}">${dep.status}</span> — ${dep.taskDefinition}`
          : '-';
      } else {
        document.getElementById('ecs-summary').textContent = 'unavailable';
      }

      const stagesBody = document.querySelector('#stages-table tbody');
      stagesBody.innerHTML = '';
      const pipeline = data.pipeline;
      if (pipeline && pipeline.stages) {
        pipeline.stages.forEach(s => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${s.stageName}</td><td class="${statusClass(s.status)}">${s.status}</td>`;
          stagesBody.appendChild(row);
        });
      }

      const historyBody = document.querySelector('#history-table tbody');
      historyBody.innerHTML = '';
      if (pipeline && pipeline.history) {
        pipeline.history.forEach(h => {
          const row = document.createElement('tr');
          const started = h.startTime ? new Date(h.startTime).toLocaleString() : '-';
          row.innerHTML = `<td>${(h.executionId || '').slice(0, 8)}</td><td class="${statusClass(h.status)}">${h.status}</td><td>${started}</td>`;
          historyBody.appendChild(row);
        });
      }
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
